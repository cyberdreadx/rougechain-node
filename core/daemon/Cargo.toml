[package]
name = "quantum-vault-daemon"
version = "1.6.6"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-reflection = "0.14"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }  # exact f64 parsing: consensus fields (fees) must survive JSON between nodes
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
axum = { version = "0.6", features = ["headers", "ws"] }
futures = "0.3"
hyper = { version = "0.14", features = ["server", "tcp", "http1", "http2"] }
tower-http = { version = "0.4", features = ["cors"] }
reqwest = { version = "0.11", features = ["json"] }
hex = "0.4"
quantum-vault-types = { path = "../types" }
quantum-vault-crypto = { path = "../crypto" }
quantum-vault-consensus = { path = "../consensus" }
quantum-vault-storage = { path = "../storage" }
quantum-vault-vm = { path = "../vm" }
quantum-vault-bridge-exec = { path = "../bridge-exec" }
quantum-vault-finality = { path = "../finality" }
# SHIELD_V2: the fixed-parameter verifier and the pool rules (docs/SHIELDED_POOL_V2_SPEC.md). The
# `test-prover` feature MUST NOT be enabled here (spec §7, L-3); only the dev-dependency below turns
# it on, for this crate's own tests (cargo's resolver 2 keeps dev-dependency features out of a
# normal build — asserted with `cargo tree`, see core/shield-v2/NOTES.md).
quantum-vault-shield-v2 = { path = "../shield-v2" }
sled = "0.34"
eth-ecdsa-verifier = "0.1"
rayon = "1.10"
sha2 = "0.10"
base64 = "0.21"

[build-dependencies]
tonic-build = "0.14"
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
wat = "1"
quantum-vault-shield-v2 = { path = "../shield-v2", features = ["test-prover"] }
# The wallet core, for `node::shield_v2_wallet_interop_tests` ONLY (it enables the `prover`
# feature of the crate above). A dev-dependency: never part of a normal daemon build — asserted
# with `cargo tree -p quantum-vault-daemon -e normal,build,features`.
quantum-vault-shield-v2-wallet = { path = "../shield-v2-wallet" }
