[package]
name = "quantum-vault-vm-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "WebAssembly surface (wasm-bindgen) over quantum-vault-vm for the browser IDE's local test chain. No network, no node state."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
quantum-vault-vm = { path = "../vm" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
bech32 = "0.11"
fips204 = "0.4"
# fips204's rand_core needs a browser entropy source on wasm32-unknown-unknown.
getrandom = { version = "0.2", features = ["js"] }
