# site-next: the new RougeChain frontend (Anders' approved design), built out alongside
# apps/web until it reaches feature parity. For a Netlify site with
# Base directory = (empty, repo root) and Package directory = apps/site-next.
[build]
  command = "npm run build -w @rougechain/site-next"
  publish = "apps/site-next/dist"

[build.environment]
  NODE_VERSION = "20.19.0"

# Same headers as the live rougechain.io config (repo-root netlify.toml), plus /sw.js never cached
# so returning visitors pick up the service-worker retirement script immediately.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Per-item explorer pages (one per transaction, block, address or bridge transfer) are rendered in the
# browser; Google files them as "soft 404" and nobody searches for a hash. Keep them out of the index;
# the list pages (/explorer, /transactions, /tokens, …) stay indexable.
[[headers]]
  for = "/tx/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/block/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/address/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/explorer/bridge/*"
  [headers.values]
    X-Robots-Tag = "noindex"
