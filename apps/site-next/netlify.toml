# site-next: the new RougeChain frontend (Anders' approved design), built out alongside
# apps/web until it reaches feature parity. For a Netlify site with
# Base directory = (empty, repo root) and Package directory = apps/site-next.
[build]
  command = "npm run build -w @rougechain/site-next"
  publish = "apps/site-next/dist"

[build.environment]
  NODE_VERSION = "20.19.0"

# Same headers as the live rougechain.io config (repo-root netlify.toml), plus /sw.js never cached
# so returning visitors pick up the service-worker retirement script immediately.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
