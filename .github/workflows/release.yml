name: Release manifests

# Node releases are built reproducibly by the release owner and described by SIGNED manifests in
# releases/ (see scripts/release/README.md). CI does not build or publish release binaries: it
# checks that the committed manifests are schema-valid and carry valid Ed25519 + ML-DSA-65
# signatures from the committed release keys, that the installer embeds the same Ed25519 key,
# and that the release tooling and the installer pass their tests.
#
# While no release key is committed under releases/keys/ the manifests are allowed to be
# unsigned (--allow-unsigned has no effect once keys exist: an unsigned manifest then fails).
on:
  pull_request:
    paths:
      - 'releases/**'
      - 'scripts/release/**'
      - 'scripts/install-validator.sh'
      - '.github/workflows/release.yml'
  push:
    branches: [ main ]
    paths:
      - 'releases/**'
      - 'scripts/release/**'
      - 'scripts/install-validator.sh'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-manifests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-manifests:
    name: verify release manifests + tooling tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/release/package-lock.json

      - name: Install release tooling
        working-directory: scripts/release
        run: npm ci --no-audit --no-fund

      - name: Verify manifests (schema, both signatures, installer key)
        working-directory: scripts/release
        run: |
          for net in mainnet testnet; do
            node verify-manifest.mjs --allow-unsigned --network "$net" \
              --check-installer ../install-validator.sh "../../releases/manifest-$net.json"
          done

      - name: Mainnet manifest matches the committed genesis file
        working-directory: scripts/release
        run: node verify-manifest.mjs --allow-unsigned --genesis ../../core/daemon/genesis-mainnet.json ../../releases/manifest-mainnet.json

      - name: Tooling tests
        working-directory: scripts/release
        run: npm test

      - name: shellcheck
        run: shellcheck scripts/install-validator.sh scripts/release/test-installer.sh scripts/release/test/installer-scenarios.sh

  installer-e2e:
    name: installer end-to-end (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/release/package-lock.json

      - name: Installer scenarios (ubuntu:24.04, debian:12, ubuntu:22.04)
        run: scripts/release/test-installer.sh
