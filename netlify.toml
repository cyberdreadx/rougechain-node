[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # the /buy page bundles the LI.FI router widget; rollup needs more heap than the Node default
  NODE_OPTIONS = "--max-old-space-size=4096"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "application/javascript"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
