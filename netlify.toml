[build]
  # Monorepo: the site lives in apps/web. npm installs all workspaces from the root;
  # `npm run build` runs apps/web's build (vite + OG images + prerender).
  command = "npm run build"
  publish = "apps/web/dist"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "application/javascript"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
