[package]
name = "rougechain-counter"
version = "0.1.0"
edition = "2021"

# The smallest useful RougeChain contract: a shared counter. Starting point of the IDE
# (rougechain.io/ide) — storage, arguments, return values, events and the caller.
[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
